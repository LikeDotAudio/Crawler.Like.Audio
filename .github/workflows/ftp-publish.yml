name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install
        working-directory: ./Thin

      - name: Build Next.js Static Export
        run: npm run build
        working-directory: ./Thin

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: crawler.like.audio
          username: crawler@like.audio
          # IMPORTANT: For security, the password is read from a GitHub Secret.
          # You MUST add 'FTP_PASSWORD' to your repository's Secrets.
          password: ${{ secrets.FTP_PASSWORD }}
          
          # We deploy the 'out' directory generated by Next.js static export
          local-dir: ./Thin/out/
          
          # Deploy to the root of the FTP server (change if needed)
          server-dir: /
