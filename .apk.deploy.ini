# Part of the APK.audio project — http://APK.audio — made by Anthony Kuzub
# How this site ships. Read by .apk.scripts/deploy_all.py in the APK.audio checkout:
# `steps` run here in order (any failure stops this site), then `local_dir` is
# mirrored to `server_dir` over FTPS — or `command` uploads instead. `env` maps
# names this site expects to slots in ~/.apk.secrets.env (never committed).
# This replaced the GitHub Actions workflow on 2026-10-31.
# Built WITHOUT a base path for crawler.like.audio. The APK.audio site builds the
# same Thin/out again with CRAWLER_BASE_PATH, which is why the root deploys last.
[deploy]
site = crawler.like.audio
url = https://crawler.like.audio/
steps =
    cd Thin && npm ci && npm run lint && npm test
    cd Thick && python3 -m unittest discover -s tests
    cd Thin && npm run build
local_dir = Thin/out
server_dir = ./
server = crawler.like.audio
username = crawler@like.audio
env =
    FTP_PASSWORD = CRAWLER_FTP_PASSWORD
